# Builds the lab's image (Dockerfile: Python 3.12 slim plus quokka/) for amd64 and
# arm64 and publishes it as ghcr.io/aicode-huji/quokka-lab:<version>, the
# version in quokka/__init__.py, which docker-compose.yml pulls
# (tests/test_compose.py keeps the two in step). Students then never build
# anything, so no build cache is left on their laptops. Runs when the lab's
# code changes, or by hand (Actions tab). Bump __version__ for a release that
# students who already pulled should get: Compose doesn't pull a tag it has.
name: Lab image

on:
  push:
    branches: [main]
    paths:
      - "quokka/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/lab-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REPO: ghcr.io/aicode-huji/quokka-lab

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read the lab version
        id: version
        run: echo "tag=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' quokka/__init__.py)" >> "$GITHUB_OUTPUT"
      - name: The tests pass
        run: python3 -m unittest discover tests
      # Small image: arm64 under QEMU only runs useradd and mkdir.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REPO }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The Quokka red-team lab
      - name: Show the platforms
        run: docker buildx imagetools inspect "$REPO:${{ steps.version.outputs.tag }}"
      # The published image starts and reports its version.
      - name: Smoke test
        run: docker run --rm "$REPO:${{ steps.version.outputs.tag }}" python -c "import quokka; print(quokka.__version__)"
