# Builds the CPU-only Ollama image (ollama/Dockerfile) for amd64 and arm64 and
# publishes it as ghcr.io/aicode-huji/quokka-ollama-cpu:0.40.16, which
# docker-compose.yml pulls. Runs when ollama/ changes, or by hand (Actions tab).
#
# One job per platform: each unpacks the official 8.5 GB image once, and both
# at once don't fit on a runner's disk. arm64 builds under QEMU (only apt-get
# runs emulated). A last job joins the two into one multi-platform tag.
name: Ollama image

on:
  push:
    branches: [main]
    paths:
      - "ollama/**"
      - ".github/workflows/ollama-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REPO: ghcr.io/aicode-huji/quokka-ollama-cpu
  TAG: "0.40.16"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only: the tag comes in the merge job.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ollama
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Ollama 0.40.16 for the CPU only, for the Quokka lab
          outputs: type=image,name=${{ env.REPO }},push-by-digest=true,name-canonical=true,push=true
      - name: Save the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both platforms as one image
        working-directory: digests
        run: |
          docker buildx imagetools create -t "$REPO:$TAG" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=Ollama 0.40.16 for the CPU only, for the Quokka lab" \
            $(printf "$REPO@sha256:%s " *)
      - name: Show the platforms
        run: docker buildx imagetools inspect "$REPO:$TAG"
      # The published image starts and reports its version.
      - name: Smoke test
        run: docker run --rm "$REPO:$TAG" --version
